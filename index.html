<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Diary</title>
<style>
:root {
  --bg:#000;
  --surface:#000;
  --surface-2:#0a0a0a;
  --text:#f2f2f2;
  --muted:#777;
  --line:#242424;
  --accent:#1d9bf0;
  --chip:#101820;
  --shadow:none;
}
html[data-theme="light"] {
  --bg:#fff;
  --surface:#fff;
  --surface-2:#f7f7f7;
  --text:#111;
  --muted:#6b6b6b;
  --line:#e5e5e5;
  --accent:#0f77b7;
  --chip:#eef7fc;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.page{max-width:760px;margin:0 auto;min-height:100vh}
.header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 92%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{padding:14px 16px 12px}
.profile-row{display:flex;align-items:center;gap:12px}
.avatar-main{
  width:48px;height:48px;border-radius:50%;object-fit:cover;
  border:1px solid var(--line);flex:0 0 auto;
}
.title-wrap{min-width:0;flex:1}
.title{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.handle{font-size:13px;color:var(--muted);margin-top:2px}
.profile-links{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:6px
}
.profile-links a{
  color:var(--muted);text-decoration:none;font-size:12px;font-weight:600
}
.profile-links a:hover{
  color:var(--text);text-decoration:underline
}
.theme-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);
  color:var(--text);display:grid;place-items:center;font-size:18px;
}
.theme-btn:hover{background:var(--surface-2)}

.controls{padding:10px 16px 12px;border-top:1px solid var(--line)}
.search{
  width:100%;border:1px solid var(--line);border-radius:999px;
  background:var(--surface-2);color:var(--text);
  padding:11px 15px;outline:none;
}
.search:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:9px;align-items:center}
.period-select{
  flex:1;min-width:0;
  border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--text);
  padding:9px 12px;outline:none;
}
.clear-btn{
  border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--text);padding:9px 13px;
}
.clear-btn:hover{background:var(--surface-2)}
.custom-dates{
  display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;
}
.custom-dates.show{display:grid}
.date-input{
  width:100%;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--text);padding:9px 10px;color-scheme:dark;
}
html[data-theme="light"] .date-input{color-scheme:light}

.tags-strip{
  display:flex;gap:7px;overflow-x:auto;padding:0 16px 11px;
  scrollbar-width:none;border-bottom:1px solid var(--line);
}
.tags-strip::-webkit-scrollbar{display:none}
.tag-chip{
  white-space:nowrap;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--text);padding:7px 10px;
  font-size:12px;
}
.tag-chip.active{
  color:var(--accent);border-color:var(--accent);background:var(--chip);
}

.summary{
  padding:10px 16px;color:var(--muted);font-size:12px;
  border-bottom:1px solid var(--line);
}

.week{border-bottom:8px solid var(--surface-2)}
.week-head{
  position:sticky;top:132px;z-index:20;
  background:color-mix(in srgb,var(--bg) 94%, transparent);
  backdrop-filter:blur(12px);
  padding:10px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.week-title{font-size:13px;font-weight:800;letter-spacing:.01em}
.week-count{font-size:12px;color:var(--muted)}

.post{
  display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--line);
  background:var(--surface);
}
.post:last-child{border-bottom:0}
.avatar{
  width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--line);
}
.meta{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap}
.name{font-weight:800;font-size:14px}
.user{font-size:13px;color:var(--muted)}
.when{font-size:13px;color:var(--muted)}
.post-text{font-size:16px;line-height:1.42;margin-top:3px}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.post-tag{
  border:0;background:none;color:var(--accent);padding:0;
  font-size:13px;
}
.post-tag:hover{text-decoration:underline}
.link-card{
  display:block;margin-top:10px;border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;text-decoration:none;
  background:var(--surface-2);
}
.link-card:hover{border-color:var(--muted)}
.link-label{font-size:12px;color:var(--muted)}
.link-url{font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{padding:48px 18px;text-align:center;color:var(--muted)}

.footer{
  padding:24px 16px 40px;color:var(--muted);font-size:12px;text-align:center;
}

@media(max-width:640px){
  .page{max-width:none}
  .header-inner{padding:12px 13px 10px}
  .controls{padding:9px 13px 10px}
  .tags-strip{padding:0 13px 10px}
  .summary{padding:9px 13px}
  .week-head{top:127px;padding:9px 13px}
  .post{padding:13px;grid-template-columns:40px 1fr}
  .avatar{width:38px;height:38px}
  .post-text{font-size:15.5px}
}
</style>
</head>

const topTags = ["#prompt", "#ai", "#didattica", "#tool", "#lavoro", "#ricerca", "#pubblicato", "#magazine", "#architettura", "#web", "#archivio", "#agenti", "#automazione", "#immagini"];

const state = {
  query: '',
  activeTag: null,
  period: 'all',
  from: '',
  to: ''
};

const els = {
  feed: document.getElementById('feed'),
  summary: document.getElementById('summary'),
  search: document.getElementById('search'),
  period: document.getElementById('period'),
  clear: document.getElementById('clear'),
  tagStrip: document.getElementById('tagStrip'),
  customDates: document.getElementById('customDates'),
  fromDate: document.getElementById('fromDate'),
  toDate: document.getElementById('toDate'),
  themeToggle: document.getElementById('themeToggle')
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[ch]);
}

function shortDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return new Intl.DateTimeFormat('it-IT', {
    day:'2-digit', month:'short', year:'numeric'
  }).format(d);
}

function domain(url) {
  try { return new URL(url).hostname.replace(/^www\./,''); }
  catch(e) { return url; }
}

function latestDate() {
  return entries.length ? entries[0].date : new Date().toISOString().slice(0,10);
}

function dateMinusDays(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}

function periodBounds() {
  const latest = latestDate();
  if (state.period === '7') return [dateMinusDays(latest, 6), latest];
  if (state.period === '30') return [dateMinusDays(latest, 29), latest];
  if (state.period === '90') return [dateMinusDays(latest, 89), latest];
  if (state.period === '2026') return ['2026-01-01','2026-12-31'];
  if (state.period === '2025') return ['2025-01-01','2025-12-31'];
  if (state.period === 'custom') return [state.from || '0000-01-01', state.to || '9999-12-31'];
  return ['0000-01-01','9999-12-31'];
}

function filterEntries() {
  const [from,to] = periodBounds();
  const q = state.query.toLowerCase();

  return entries.filter(e => {
    const dateOK = e.date >= from && e.date <= to;
    const tagOK = !state.activeTag || e.tags.includes(state.activeTag);
    const hay = (e.text + ' ' + e.tags.join(' ') + ' ' + (e.link || '')).toLowerCase();
    const queryOK = !q || hay.includes(q);
    return dateOK && tagOK && queryOK;
  });
}

function groupByWeek(list) {
  const map = new Map();
  for (const e of list) {
    if (!map.has(e.week)) map.set(e.week, { label:e.weekLabel, items:[] });
    map.get(e.week).items.push(e);
  }
  return [...map.entries()];
}

function renderTagStrip() {
  const all = `
    <button class="tag-chip ${state.activeTag ? '' : 'active'}" data-tag="">Tutti</button>
  `;
  const rest = topTags.map(tag => `
    <button class="tag-chip ${state.activeTag === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)}</button>
  `).join('');

  els.tagStrip.innerHTML = all + rest;

  els.tagStrip.querySelectorAll('[data-tag]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTag = btn.dataset.tag || null;
      render();
    });
  });
}

function render() {
  const list = filterEntries();
  const weeks = groupByWeek(list);

          </div>
          <div>
            <div class="meta">
              <span class="name">Emanuele BDC</span>
              <span class="user">@emaf205</span>
              <span class="when">· ${shortDate(e.date)}${e.time ? ' · ' + e.time : ''}</span>
            </div>

            <div class="post-text">${esc(e.text)}</div>

            <div class="post-tags">
              ${e.tags.map(tag => `
                <button class="post-tag" data-tag="${esc(tag)}">${esc(tag)}</button>
              `).join('')}
            </div>

            ${e.link ? `
              <a class="link-card" href="${esc(e.link)}" target="_blank" rel="noopener">
                <div class="link-label">Link pubblico</div>
                <div class="link-url">${esc(domain(e.link))}</div>
              </a>
            ` : ''}
          </div>
        </article>
      `).join('')}
    </section>
  `).join('');

  els.feed.querySelectorAll('.post-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTag = btn.dataset.tag;
      window.scrollTo({top:0, behavior:'smooth'});
      render();
    });
  });
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('ai-diary-theme', theme);
  els.themeToggle.textContent = theme === 'dark' ? '☼' : '◐';
  els.themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro');
}

els.search.addEventListener('input', e => {
  state.query = e.target.value.trim();
  render();
});

els.period.addEventListener('change', e => {
  state.period = e.target.value;
  els.customDates.classList.toggle('show', state.period === 'custom');
  render();
});

els.fromDate.addEventListener('change', e => {
  state.from = e.target.value;
  render();
});

els.toDate.addEventListener('change', e => {
  state.to = e.target.value;
  render();
});

els.clear.addEventListener('click', () => {
  state.query = '';
  state.activeTag = null;
  state.period = 'all';
  state.from = '';
  state.to = '';

  els.search.value = '';
  els.period.value = 'all';
  els.fromDate.value = '';
  els.toDate.value = '';
  els.customDates.classList.remove('show');

  render();
});

els.themeToggle.addEventListener('click', () => {
  const current = document.documentElement.dataset.theme;
  setTheme(current === 'dark' ? 'light' : 'dark');
});

const savedTheme = localStorage.getItem('ai-diary-theme');
const preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
setTheme(savedTheme || preferred);

render();
</script>
